<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Himari live test v2</title>
<style>html,body{margin:0;height:100%;background:linear-gradient(#2b2f3a,#151821);overflow:hidden;font-family:system-ui,sans-serif}
#box{position:fixed;left:4%;right:4%;bottom:4%;background:rgba(10,12,20,.82);color:#f3eef0;border:1px solid #6b7a5a;border-radius:12px;padding:12px 16px;min-height:3.2em;font-size:17px}
#box b{color:#9fd36b;display:block;font-size:14px;margin-bottom:4px}
#ctl{position:fixed;top:12px;right:12px;display:flex;gap:8px}button{font-size:15px;padding:8px 14px;border-radius:8px;border:0;background:#6b9a3a;color:#fff}
#ver{position:fixed;top:16px;left:12px;color:#8a93a6;font-size:12px}</style></head><body>
<div id="ver">live test v2</div><div id="ctl"><button id="talk">Talk</button><button id="still">Static</button></div>
<div id="box"><b>Himari</b><span id="txt"></span></div>
<script src="pixi.min.js"></script>
<script>
(async()=>{
const W=696,H=900;const WT=await (await fetch('weights.json')).json(),AN=await (await fetch('anchors.json')).json();
const app=new PIXI.Application({resizeTo:window,backgroundAlpha:0,antialias:true,resolution:Math.min(devicePixelRatio,2),autoDensity:true});
document.body.prepend(app.view);
const T={};for(const n of ['back','body','front','eyes_half','eyes_closed','mouth_small','mouth_wide'])T[n]=await PIXI.Assets.load(n+'.png');
const root=new PIXI.Container();app.stage.addChild(root);
function mesh(tex,wkey){const m=new PIXI.SimplePlane(tex,WT.gx,WT.gy);const b=m.geometry.getBuffer('aVertexPosition');return{m,b,base:Float32Array.from(b.data),w:wkey?WT[wkey].flat():null,key:wkey}}
const back=mesh(T.back,'back'),body=mesh(T.body,null),front=mesh(T.front,'front');
const spr=(t,a)=>{const s=new PIXI.Sprite(t);s.anchor.set(.5);s.visible=false;s.home={x:a[0]+t.width/2,y:a[1]+t.height/2};return s};
const eh=spr(T.eyes_half,AN.eyes),ec=spr(T.eyes_closed,AN.eyes),ms=spr(T.mouth_small,AN.mouth),mw=spr(T.mouth_wide,AN.mouth);
root.addChild(back.m,body.m,eh,ec,ms,mw,front.m);
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
let still=false;const TAU=Math.PI*2;
function deform(x,y,t,w,layer){
  if(still)return[x,y,0];
  const br=Math.sin(t*TAU/3.8),head=1-sm(395,475,y);
  let dy=-(H-Math.max(y,430))*0.0055*br, dx=(x-348)*0.006*br*Math.exp(-(((y-660)/140)**2));
  const th=(0.013*Math.sin(t*TAU/6.1)+0.005*Math.sin(t*TAU/2.9+1))*head;
  const px=345,py=450,rx=x-px,ry=y-py;
  dx+=rx*Math.cos(th)-ry*Math.sin(th)-rx; dy+=rx*Math.sin(th)+ry*Math.cos(th)-ry;
  dy+=head*1.1*Math.sin(t*TAU/6.1+.7);
  // head-turn illusion: face/front hair slide a touch more than back hair (parallax)
  const turn=1.3*Math.sin(t*TAU/8.3+2)*head*sm(130,230,y);
  dx+=turn*(layer==='front'?1.25:layer==='back'?-0.35:1);
  if(w){ if(layer==='front') dx+=w*(1.7*Math.sin(t*TAU/2.7-y*.01)+0.7*Math.sin(t*TAU/1.9+x*.02));
         else dx+=w*(2.4*Math.sin(t*TAU/2.7-y*.01-0.55)+0.8*Math.sin(t*TAU/1.9+x*.02-0.5)); }
  return[x+dx,y+dy,th];
}
function upd(M,t){const d=M.b.data,b=M.base;for(let i=0,k=0;k<d.length;i++,k+=2){const p=deform(b[k],b[k+1],t,M.w?M.w[i]:0,M.key||'body');d[k]=p[0];d[k+1]=p[1]}M.b.update()}
function layout(){const s=Math.min(app.screen.height/H*1.02,app.screen.width/W*1.15);root.scale.set(s);root.x=(app.screen.width-W*s)/2;root.y=app.screen.height-H*s+H*s*.02}
addEventListener('resize',layout);layout();
const Q=new URLSearchParams(location.search),FZ=Q.has('freeze')?+Q.get('freeze'):null;
let blinkAt=1.0,blinkT=-1,mouth=0;const t0=performance.now();
app.ticker.add(()=>{const t=FZ!==null?FZ:(performance.now()-t0)/1000;
  upd(back,t);upd(body,t);upd(front,t);
  for(const s of [eh,ec,ms,mw]){const p=deform(s.home.x,s.home.y,t,0,'body');s.position.set(p[0],p[1]);s.rotation=p[2];}
  if(FZ===null&&t>blinkAt&&blinkT<0)blinkT=t;
  let e=0;if(blinkT>=0){const u=t-blinkT;e=u<.035?1:u<.105?2:u<.14?1:0;if(u>=.14){blinkT=-1;blinkAt=t+(Math.random()<.18?.22:2.2+Math.random()*3.5)}}
  if(Q.has('eye'))e=+Q.get('eye');if(Q.has('mouth'))mouth=+Q.get('mouth');
  eh.visible=e===1;ec.visible=e===2;ms.visible=mouth===1;mw.visible=mouth===2;
});
const lines=["Oh — you're home. I saved you some rice, it's still warm.","Don't look at me like that. I'm just tired, okay?","Do you ever think about leaving this town? Just… going?"];let li=0,typing=null;
function shape(c,prev){if(!c||/[\s.,!?…—'"]/.test(c))return 0;if(/[aeiouAEIOU]/.test(c))return /[aoAO]/.test(c)?2:(prev===2?1:2);return Math.random()<.55?1:0}
function say(){clearInterval(typing);const s=lines[li++%lines.length];let n=0;const el=document.getElementById('txt');el.textContent='';
  typing=setInterval(()=>{n++;el.textContent=s.slice(0,n);mouth=shape(s[n-1],mouth);if(n>=s.length){clearInterval(typing);setTimeout(()=>mouth=0,60)}},48)}
document.getElementById('talk').onclick=say;
document.getElementById('still').onclick=e=>{still=!still;e.target.textContent=still?'Live':'Static'};
if(!Q.has('freeze'))setTimeout(say,1400);
})();
</script></body></html>
